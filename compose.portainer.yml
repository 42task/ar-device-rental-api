# Docker Standalone / Compose Stack; not a Docker Swarm stack.
services:
  app:
    image: ${RENTAL_API_IMAGE:-hkccr.ccs.tencentyun.com/gdgeek/ar-device-rental-api:publish}
    pull_policy: always
    restart: unless-stopped
    init: true
    command: ["sh", "-c", "npm run migrate && exec node dist/src/main.js"]
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "8080"
      HOST: "0.0.0.0"
      TRUST_PROXY: "1"
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://d.4mr.cn}
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ar_device_rental}
      MYSQL_USER: ${MYSQL_USER:-ar_rental}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
      MYSQL_POOL_SIZE: ${MYSQL_POOL_SIZE:-10}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_SECRET_PATH: ${JWT_SECRET_PATH:-/run/secrets/jwt-secret}
      JWT_ISSUER: ${JWT_ISSUER:-ar-device-rental-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-ar-device-rental-mini-program}
      WECHAT_APP_ID: wx03dbf50c15cac06f
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:-}
      WECHAT_APP_SECRET_PATH: ${WECHAT_APP_SECRET_PATH:-/run/secrets/wechat-app-secret}
      WECHAT_PAY_ENABLED: ${WECHAT_PAY_ENABLED:-0}
      WECHAT_PAY_MCH_ID: ${WECHAT_PAY_MCH_ID:-}
      WECHAT_PAY_SERIAL_NO: ${WECHAT_PAY_SERIAL_NO:-}
      WECHAT_PAY_PRIVATE_KEY_PATH: ${WECHAT_PAY_PRIVATE_KEY_PATH:-}
      WECHAT_PAY_API_V3_KEY: ${WECHAT_PAY_API_V3_KEY:-}
      WECHAT_PAY_API_V3_KEY_PATH: ${WECHAT_PAY_API_V3_KEY_PATH:-}
      WECHAT_PAY_PLATFORM_SERIAL_NO: ${WECHAT_PAY_PLATFORM_SERIAL_NO:-}
      WECHAT_PAY_PLATFORM_PUBLIC_KEY_PATH: ${WECHAT_PAY_PLATFORM_PUBLIC_KEY_PATH:-}
      WECHAT_PAY_PLATFORM_KEYS_JSON: ${WECHAT_PAY_PLATFORM_KEYS_JSON:-}
      RENTAL_CALLBACK_BASE_URL: ${RENTAL_CALLBACK_BASE_URL:-https://d.4mr.cn/api/v2/rental}
    volumes:
      - type: bind
        source: ${RENTAL_SECRETS_DIR:?set absolute RENTAL_SECRETS_DIR on Docker host}
        target: /run/secrets
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 40s
    expose: ["8080"]
    networks: [database, proxy]
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-proxy}
      - traefik.http.routers.ar-device-rental-api.rule=Host(`d.4mr.cn`)
      - traefik.http.routers.ar-device-rental-api.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.ar-device-rental-api.tls=true
      - traefik.http.routers.ar-device-rental-api.service=ar-device-rental-api
      - traefik.http.services.ar-device-rental-api.loadbalancer.server.port=8080

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ar_device_rental}
      MYSQL_USER: ${MYSQL_USER:-ar_rental}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks: [database]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_PASSWORD}\" mysql --host=127.0.0.1 --user=\"$${MYSQL_USER}\" --database=\"$${MYSQL_DATABASE}\" --execute='SELECT 1' --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    labels:
      - traefik.enable=false

volumes:
  mysql_data:

networks:
  database:
    internal: true
  proxy:
    external: true
    name: ${TRAEFIK_NETWORK:-proxy}
