name: Verify QR-only API and publish immutable Tencent image

on:
  push:
    branches: [codex/qr-only-api-20261123]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: hkccr.ccs.tencentyun.com/gdgeek/ar-device-rental-api

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-test-only-db-password
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: ar_rental_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-test-only-db-password --silent"
          --health-interval=10s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - name: Verify MySQL transactions and concurrency
        run: npm run test:integration
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: "3306"
          MYSQL_DATABASE: ar_rental_test
          MYSQL_USER: root
          MYSQL_PASSWORD: ci-test-only-db-password

  image:
    needs: verify
    if: github.repository == '42task/ar-device-rental-api' && github.event_name == 'push' && github.ref == 'refs/heads/codex/qr-only-api-20261123'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Check Tencent registry credentials
        shell: bash
        env:
          TENCENT_DOCKER_USERNAME: ${{ secrets.TENCENT_DOCKER_USERNAME }}
          TENCENT_DOCKER_PASSWORD: ${{ secrets.TENCENT_DOCKER_PASSWORD }}
        run: |
          if [[ -z "$TENCENT_DOCKER_USERNAME" || -z "$TENCENT_DOCKER_PASSWORD" ]]; then
            echo "::error::Configure the existing Tencent registry credentials."
            exit 1
          fi
      - name: Authenticate to Tencent Hong Kong registry
        uses: docker/login-action@v4
        with:
          registry: hkccr.ccs.tencentyun.com
          username: ${{ secrets.TENCENT_DOCKER_USERNAME }}
          password: ${{ secrets.TENCENT_DOCKER_PASSWORD }}
      - name: Check current hotfix branch head
        shell: bash
        run: |
          remote_sha="$(git ls-remote --exit-code origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)"
          if [[ "$remote_sha" != "$GITHUB_SHA" ]]; then
            echo "::error::The hotfix branch head no longer matches this run."
            exit 1
          fi
      - name: Build and publish immutable hotfix image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          outputs: type=image,push=true,oci-mediatypes=false
          provenance: false
          sbom: false
          tags: ${{ env.IMAGE_REPOSITORY }}:sha-${{ github.sha }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=api-qr-only-20261123
          cache-to: type=gha,scope=api-qr-only-20261123,mode=max
      - name: Verify remote digest and image revision
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          image_tag="$IMAGE_REPOSITORY:sha-$GITHUB_SHA"
          remote_digest="$(docker buildx imagetools inspect "$image_tag" --format '{{.Manifest.Digest}}')"
          if [[ "$remote_digest" != "$IMAGE_DIGEST" ]]; then
            echo "::error::Published tag does not match the build digest: $image_tag"
            exit 1
          fi
          immutable_image="$IMAGE_REPOSITORY@$IMAGE_DIGEST"
          docker pull "$immutable_image"
          revision="$(docker image inspect "$immutable_image" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
          if [[ "$revision" != "$GITHUB_SHA" ]]; then
            echo "::error::Published image revision does not match this commit."
            exit 1
          fi
          {
            echo '### QR-only API image'
            printf 'Commit: %s\n\n' "$GITHUB_SHA"
            printf '%s\n%s\n' "$image_tag" "$immutable_image"
          } >> "$GITHUB_STEP_SUMMARY"
