name: Test and publish API image

on:
  push:
    branches: [main, develop, publish]
  pull_request:
    branches: [main, develop, publish]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: hkccr.ccs.tencentyun.com/gdgeek/ar-device-rental-api

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-test-only-db-password
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: ar_rental_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-test-only-db-password --silent"
          --health-interval=10s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - name: Verify MySQL transactions and concurrency
        run: npm run test:integration
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: "3306"
          MYSQL_DATABASE: ar_rental_test
          MYSQL_USER: root
          MYSQL_PASSWORD: ci-test-only-db-password

  image:
    needs: verify
    if: github.repository == '42task/ar-device-rental-api' && github.event_name != 'pull_request' && contains(fromJSON('["refs/heads/main","refs/heads/develop","refs/heads/publish"]'), github.ref)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Check Tencent registry credentials
        shell: bash
        env:
          TENCENT_DOCKER_USERNAME: ${{ secrets.TENCENT_DOCKER_USERNAME }}
          TENCENT_DOCKER_PASSWORD: ${{ secrets.TENCENT_DOCKER_PASSWORD }}
        run: |
          if [[ -z "$TENCENT_DOCKER_USERNAME" || -z "$TENCENT_DOCKER_PASSWORD" ]]; then
            echo "::error::Configure TENCENT_DOCKER_USERNAME and TENCENT_DOCKER_PASSWORD in this repository's Actions secrets."
            exit 1
          fi
      - name: Resolve allowed image tags
        id: tags
        shell: bash
        run: |
          case "$GITHUB_REF_NAME" in
            main|develop|publish) ;;
            *) echo "::error::Image publication is limited to main, develop and publish."; exit 1 ;;
          esac
          {
            echo 'tags<<IMAGE_TAGS'
            printf '%s:%s\n' "$IMAGE_REPOSITORY" "$GITHUB_REF_NAME"
            if [[ "$GITHUB_REF_NAME" == publish ]]; then
              printf '%s:latest\n' "$IMAGE_REPOSITORY"
            fi
            echo IMAGE_TAGS
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - name: Authenticate to Tencent Hong Kong registry
        uses: docker/login-action@v4
        with:
          registry: hkccr.ccs.tencentyun.com
          username: ${{ secrets.TENCENT_DOCKER_USERNAME }}
          password: ${{ secrets.TENCENT_DOCKER_PASSWORD }}
      - name: Check current branch head
        id: head
        shell: bash
        run: |
          remote_sha="$(git ls-remote --exit-code origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)"
          if [[ "$remote_sha" == "$GITHUB_SHA" ]]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo '::notice::A newer commit is present on this branch; skipping this image publication.'
          fi
      - name: Build and publish branch image
        id: build
        if: steps.head.outputs.current == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          # Match the reference registry's Docker schema2 image format.
          outputs: type=image,push=true,oci-mediatypes=false
          provenance: false
          sbom: false
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=api-${{ github.ref_name }}
          cache-to: type=gha,scope=api-${{ github.ref_name }},mode=max
      - name: Verify remote tags and image revision
        if: steps.build.outcome == 'success'
        shell: bash
        env:
          IMAGE_TAGS: ${{ steps.tags.outputs.tags }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          while IFS= read -r image_tag; do
            remote_digest="$(docker buildx imagetools inspect "$image_tag" --format '{{.Manifest.Digest}}')"
            if [[ "$remote_digest" != "$IMAGE_DIGEST" ]]; then
              echo "::error::Published tag does not match the build digest: $image_tag"
              exit 1
            fi
          done <<< "$IMAGE_TAGS"
          immutable_image="$IMAGE_REPOSITORY@$IMAGE_DIGEST"
          docker pull "$immutable_image"
          revision="$(docker image inspect "$immutable_image" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
          if [[ "$revision" != "$GITHUB_SHA" ]]; then
            echo '::error::Published image revision does not match this commit.'
            exit 1
          fi
      - name: Record published image and revision
        if: steps.build.outcome == 'success'
        shell: bash
        env:
          IMAGE_TAGS: ${{ steps.tags.outputs.tags }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo '### Tencent Hong Kong image publication'
            echo
            printf 'Commit: `%s`\n\n' "$GITHUB_SHA"
            printf '```text\n%s\n%s@%s\n```\n' "$IMAGE_TAGS" "$IMAGE_REPOSITORY" "$IMAGE_DIGEST"
            echo
            echo 'Deployment is managed separately in Portainer.'
          } >> "$GITHUB_STEP_SUMMARY"
